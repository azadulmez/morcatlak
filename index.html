<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>a.pdf – Flipbook Viewer</title>

  <!-- flipbook-viewer (jsDelivr CDN, UMD derleme) -->
  <script src="https://cdn.jsdelivr.net/npm/flipbook-viewer/dist/flipbook.min.js"></script>

  <!-- PDF.js (core + worker) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
  </script>

  <style>
    :root{ --bg:#f6f7fb; --ink:#0f172a; --muted:#64748b; --acc:#7c3aed; }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{ margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
          background:var(--bg); color:var(--ink); display:flex; flex-direction:column; }

    header{
      position:sticky; top:0; z-index:20; background:#fff; padding:.65rem 1rem;
      display:flex; gap:.75rem; align-items:center; justify-content:space-between;
      box-shadow:0 1px 10px rgba(0,0,0,.06);
    }
    .controls{ display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
    button,select{
      appearance:none; border:1px solid #e5e7eb; background:#fff; color:var(--ink);
      padding:.5rem .75rem; border-radius:999px; cursor:pointer; font-weight:600;
    }
    button:hover{ box-shadow:0 2px 10px rgba(0,0,0,.08); transform:translateY(-1px); }
    .pill{ padding:.4rem .7rem; border-radius:999px; background:#f1f5f9; color:#0f172a; font-weight:700; }
    .primary{ background:var(--acc); color:#fff; border-color:transparent; }
    .sep{ width:1px; height:28px; background:#e5e7eb; margin:0 .25rem; }

    main{ display:grid; place-items:center; padding:1rem; flex:1; min-height:0; }
    #stage{ width:min(96vw, 1200px); }
    #viewerWrap{
      position:relative; border-radius:12px; overflow:hidden; background:#fff;
      box-shadow:0 16px 40px rgba(0,0,0,.12), 0 3px 14px rgba(0,0,0,.06);
    }
    #flipTarget{ width:1000px; height:650px; margin:0 auto; } /* JS ile değişecek */

    /* Yükleniyor / Hata */
    #overlay{
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      background:linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.7));
      backdrop-filter:saturate(130%) blur(2px);
      font-weight:700; color:var(--muted);
    }
    .spinner{ width:26px;height:26px;border-radius:50%;
      border:3px solid #e2e8f0;border-top-color:var(--acc); margin-right:10px;
      animation:spin 1s linear infinite; }
    @keyframes spin{ to{ transform:rotate(360deg); } }
    #errmsg{ display:none; color:#b91c1c; background:#fee2e2; border:1px solid #fecaca; padding:.6rem .9rem; border-radius:10px; margin-top:.6rem; }

    @media (max-width: 760px){
      header{ padding:.5rem .75rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="controls">
      <span class="pill">Dergi</span>
      <span id="pageInfo" class="pill" title="Sayfa / Toplam">— / —</span>
    </div>
    <div class="controls">
      <button id="prev" title="Önceki (← / PageUp)">⟵</button>
      <button id="next" title="Sonraki (→ / Space / PageDown)">⟶</button>
      <div class="sep"></div>
      <button id="zoomOut" title="Zoom −">−</button>
      <button id="zoomIn"  title="Zoom ＋">＋</button>
      <button id="fit" class="primary" title="Ekrana sığdır (F)">Sığdır</button>
      <div class="sep"></div>
      <select id="viewMode" title="Görüntüleme">
        <option value="double" selected>Çift Sayfa</option>
        <option value="single">Tek Sayfa</option>
      </select>
    </div>
  </header>

  <main>
    <div id="stage">
      <div id="viewerWrap">
        <div id="overlay"><div class="spinner"></div>Yükleniyor…</div>
        <div id="flipTarget"></div>
      </div>
      <div id="errmsg"></div>
    </div>
  </main>

  <script>
    // ---- KULLANICI AYARI ----
    const PDF_URL = "a.pdf";     // a.pdf, index.html ile aynı klasörde olmalı
    const BASE = { w: 1000, h: 650 };
    const ZOOM = { min: 0.5, max: 2.5 };

    // ---- DURUM ----
    let viewer = null;           // flipbook-viewer instance
    let pdfDoc = null;           // pdf.js document
    let totalPages = 0;
    let zoom = 1;
    let viewMode = "double";     // 'single' | 'double'

    const $target   = document.getElementById("flipTarget");
    const $overlay  = document.getElementById("overlay");
    const $errmsg   = document.getElementById("errmsg");
    const $pageInfo = document.getElementById("pageInfo");
    const $viewMode = document.getElementById("viewMode");

    // ---- Yardımcılar ----
    const debounce = (fn,ms)=>{ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; };
    const computeSize = ()=>{
      const maxW = Math.min(window.innerWidth * 0.96, 1200);
      const ratio = BASE.h / BASE.w;
      const targetW = viewMode === "single" ? Math.min(maxW, 740) : maxW;
      const targetH = Math.round(targetW * ratio);
      return { w: targetW, h: targetH };
    };
    function applySize(){
      const {w,h} = computeSize();
      $target.style.width  = w+"px";
      $target.style.height = h+"px";
      if (viewer) viewer.resize(w, h);  // flipbook-viewer’ın resize’ı
    }
    const onResize = debounce(()=>{ applySize(); renderAround(currentPage()); }, 120);
    window.addEventListener("resize", onResize);

    function showError(msg){ $errmsg.textContent = msg; $errmsg.style.display = "block"; }
    function hideError(){ $errmsg.style.display = "none"; $errmsg.textContent = ""; }

    // ---- PDF Provider (flipbook-viewer book interface) ----
    // numPages(): number, getPage(num, cb): cb(CanvasImageSource)
    function makePdfBook(pdf){
      return {
        numPages: () => pdf.numPages,
        getPage: async (num, cb) => {
          const page = await pdf.getPage(num);
          const { w:flipW, h:flipH } = computeSize();
          const pageW = (viewMode === "single") ? flipW : flipW/2;
          const pageH = flipH;

          const viewport1 = page.getViewport({ scale: 1 });
          const scale = Math.min(pageW/viewport1.width, pageH/viewport1.height) * zoom;
          const viewport = page.getViewport({ scale });

          const ratio = window.devicePixelRatio || 1;
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");

          canvas.width  = Math.floor(viewport.width  * ratio);
          canvas.height = Math.floor(viewport.height * ratio);
          canvas.style.width  = Math.floor(viewport.width)  + "px";
          canvas.style.height = Math.floor(viewport.height) + "px";
          ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

          await page.render({ canvasContext: ctx, viewport }).promise;
          cb(canvas); // flipbook-viewer CanvasImageSource kabul ediyor
        }
      };
    }

    // ---- Flipbook kur ----
    function buildFlip(book){
      const opts = {
        width:  computeSize().w,
        height: computeSize().h,
        backgroundColor: "#ffffff",
        boxColor: "#ffffff",
        singlepage: (viewMode === "single") // tek sayfa modu
      };
      window.flipbook.init(book, "flipTarget", opts, (err, vwr) => {
        if (err) { showError("Flipbook başlatılamadı: " + err.message); return; }
        viewer = vwr;
        updatePageInfo();
        // seen event → sayfa göstergesi
        viewer.on("seen", (n)=> { updatePageInfo(n); });
        bindControls();
        renderAround(currentPage());
      });
    }

    function currentPage(){ return viewer ? viewer.page_number || 1 : 1; }
    function updatePageInfo(n){
      const p = n || currentPage();
      $pageInfo.textContent = `${p} / ${totalPages}`;
    }

    // Yakın sayfaları iste (performans)
    function renderAround(p){
      if (!viewer) return;
      // flipbook-viewer ihtiyaç duydukça getPage çağırır; burada sadece yeniden boyut için redraw tetikliyoruz
      viewer.redraw && viewer.redraw(); // varsa (yeni sürümlerde mevcut)
    }

    // ---- Kontroller + Klavye ----
    function bindControls(){
      document.getElementById("prev").onclick = ()=> viewer && viewer.flip_back();
      document.getElementById("next").onclick = ()=> viewer && viewer.flip_forward();
      document.getElementById("zoomIn").onclick  = ()=>{ zoom = Math.min(ZOOM.max, zoom+0.1); applySize(); renderAround(currentPage()); };
      document.getElementById("zoomOut").onclick = ()=>{ zoom = Math.max(ZOOM.min, zoom-0.1); applySize(); renderAround(currentPage()); };
      document.getElementById("fit").onclick     = ()=>{ zoom = 1; applySize(); renderAround(currentPage()); };
      $viewMode.onchange = (e)=>{ viewMode = e.target.value; applySize(); // yeniden kur
        // viewer tek/çift bilgisini seçenek olarak alıyor; tekrar init edelim:
        const book = makePdfBook(pdfDoc);
        buildFlip(book);
      };

      // Klavye
      document.addEventListener("keydown", (ev)=>{
        const tag = (ev.target.tagName||"").toLowerCase();
        if(tag === "input" || tag === "textarea") return;
        if(ev.key === "ArrowLeft" || ev.key === "PageUp"){ ev.preventDefault(); viewer && viewer.flip_back(); }
        else if(ev.key === "ArrowRight" || ev.key === " " || ev.key === "PageDown"){ ev.preventDefault(); viewer && viewer.flip_forward(); }
        else if(ev.key === "+" || ev.key === "="){ ev.preventDefault(); document.getElementById("zoomIn").click(); }
        else if(ev.key === "-" || ev.key === "_"){ ev.preventDefault(); document.getElementById("zoomOut").click(); }
        else if(ev.key.toLowerCase() === "f"){ ev.preventDefault(); document.getElementById("fit").click(); }
        else if(ev.key.toLowerCase() === "s"){ ev.preventDefault();
          viewMode = (viewMode==="single") ? "double" : "single";
          $viewMode.value = viewMode; $viewMode.onchange({target:$viewMode});
        }
      });
    }

    // ---- Başlat ----
    (async function start(){
      try{
        hideError();
        // PDF var mı (404 testi)
        const head = await fetch(PDF_URL, { method:"HEAD", cache:"no-store" });
        if(!head.ok) throw new Error(`PDF bulunamadı (HTTP ${head.status}). 'a.pdf' adı/konumu doğru mu?`);
        pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;
        totalPages = pdfDoc.numPages;

        applySize();
        buildFlip( makePdfBook(pdfDoc) );
      }catch(err){
        console.error(err);
        showError("PDF yüklenemedi: " + err.message +
                  "\n• 'a.pdf' index.html ile aynı klasörde mi?\n• Dosya adı tam olarak 'a.pdf' mi?");
      }finally{
        $overlay.style.display = "none";
      }
    })();
  </script>
</body>
</html>
